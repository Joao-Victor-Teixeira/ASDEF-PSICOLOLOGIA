<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Paciente - ONG</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        input:focus, textarea:focus { border-color: #007bff; outline: none; }
        
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #218838; }
        
        .btn-voltar { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px; }
        .btn-voltar:hover { text-decoration: underline; }

        .mensagem { margin-top: 10px; padding: 10px; border-radius: 5px; display: none; text-align: center; }
        .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Cadastrar Paciente</h2>
    
    <form id="formCadastro">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Ex: João da Silva" required>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(XX) XXXXX-XXXX" required>
        </div>

        <div class="form-group">
            <label for="observacao">Observação / Queixa</label>
            <textarea id="observacao" rows="4" placeholder="Descreva brevemente o motivo..."></textarea>
        </div>

        <button type="submit">Confirmar Cadastro</button>
    </form>
    
    <div id="msgSucesso" class="mensagem sucesso">Paciente cadastrado com sucesso!</div>
    <div id="msgErro" class="mensagem erro">Erro ao cadastrar. Tente novamente.</div>

    <a href="lista.html" class="btn-voltar">Voltar para a lista</a>
</div>

<script>
    document.getElementById('formCadastro').addEventListener('submit', async function(event) {
        event.preventDefault(); // Impede a página de recarregar sozinha

        // 1. Pega os dados dos campos
        const dados = {
            nome: document.getElementById('nome').value,
            telefone: document.getElementById('telefone').value,
            observacao: document.getElementById('observacao').value
        };

        // Esconde mensagens antigas
        document.getElementById('msgSucesso').style.display = 'none';
        document.getElementById('msgErro').style.display = 'none';

        try {
            // 2. Envia para o Backend (Spring Boot)
            const resposta = await fetch('/pacientes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dados)
            });

            // 3. Verifica se deu certo
            if (resposta.ok) {
                document.getElementById('msgSucesso').style.display = 'block';
                document.getElementById('formCadastro').reset(); // Limpa os campos
                
                // Opcional: Redirecionar para a lista após 2 segundos
                setTimeout(() => {
                   window.location.href = "index.html"; 
                }, 2000);
            } else {
                throw new Error('Erro na resposta da API');
            }
        } catch (error) {
            console.error(error);
            document.getElementById('msgErro').style.display = 'block';
        }
    });
</script>

</body>
</html>
